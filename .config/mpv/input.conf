#             # == INPUT.CONF == #
# by 4ndr0666
#
# ------------------------
# CREATE CLIPS ON THE FLY
# (a) marks the clip START time
# (b) marks the clip END time
# (c) CLEARs the time
# (G) GIVES the execute order
#
# (Just uncomment the keybinds below to use:)
# a  run "mkdir" "-p" "/tmp/ffcut" ; run "/bin/sh" "-c" "echo ${=time-pos} > /tmp/ffcut/start" ; set ab-loop-a ${=time-pos}
# b  run "mkdir" "-p" "/tmp/ffcut" ; run "/bin/sh" "-c" "echo ${=time-pos} > /tmp/ffcut/end &" ; set ab-loop-b ${=time-pos}
# c  set ab-loop-a no ; set ab-loop-b no
# G  run "/bin/sh" "-c" "echo '${path}' > /tmp/ffcut/last_file" ; run "ffcut" "${path}"
# -----------------------------------------------------------------------------

# SETUP TOGGLE KEYS
t                ignore
t-p              ignore

# TOOGLEABLE PROFILES
t-p-h            apply-profile HQ ; show-text "HQ Profile Activated"
t-p-r            apply-profile reverse ; show-text "Reverse Play Activated"
t-p-p            apply-profile playdir ; show-text "Playdir Profile Activated"
t-p-n            apply-profile network ; show-text "Network Profile Activated"

# SETUP CYCLICAL COMMANDS
p                cycle pause
V                cycle video                                                    # If screen is blank
T                cycle ontop
W                cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"  # Aspect Ratio
l                ab-loop
L                cycle-values loop-file "inf" "no"                              # Repeat
F3               cycle-values shuffle "yes" "no"                                # Shuffle
#H                cycle-values hwdec "auto-copy" "safe"

# SEEK
LEFT             seek -5 #seek -0.75 - exact
RIGHT            seek 5  #seek 0.75 - exact
down             seek -60
up               seek 60
# (below for frame-perfect navigation)
Shift+RIGHT      no-osd seek  1 exact
Shift+LEFT       no-osd seek -1 exact

# ZOOM
WHEEL_UP         add video-zoom 0.25
WHEEL_DOWN       add video-zoom -0.25
#w                cycle-values window-scale 1 .5

# ROTATE
=                add video-rotate 90
-                add video-rotate -90

# PAN
Alt+left         add video-pan-x -0.05
Alt+right        add video-pan-x 0.05
Alt+up           add video-pan-y -0.05
Alt+down         add video-pan-y 0.05
0                set video-zoom 0; set video-pan-x 0; set video-pan-y 0; set video-rotate 0; show-text "Zoom, Pan and Rotate Cleared"

# SPEED
[                multiply speed 0.9091
]                multiply speed 1.1
\                set speed 1.0; show-text "Speed Reset"
.                frame-step
,                frame-back-step

# AUDIO
ctrl++           add audio-delay 0.100           # change audio/video sync by delaying the audio
ctrl+-           add audio-delay -0.100          # change audio/video sync by shifting the audio earlier

# RESET EQ
Alt+0            set contrast 0; set brightness 0; set gamma 0; set saturation 0; show-text "EQ Settings cleared"

# SCREENSHOTS
s                screenshot
Shift+s          screenshot each-frame
Ctrl+s           screenshot window

# CONSOLE COMMANDS:
#%                script-message-to console type "seek 0.5 absolute-percent" 6 #Enter a percent position to seek to and close the console.
%                script-message-to console type "seek absolute-percent; keypress ESC" 6 #Enter a percent position to seek to and close the console.
Ctrl+o           script-message-to console type "loadfile ''; keypress ESC" 11 #Enter a file or URL to play. Tab completes paths in the filesystem.
#i                show-progress


# ===  SCRIPT COMMANDS === #

# PLAYLIST MANAGER
F1               script-binding select/select-playlist
F2               show-text ${playlist}
#<                playlist-prev
#>                playlist-next

# NEXTFILE
<                script-binding previousfile
>                script-binding nextfile

# VIDEOCLIP:
c                script-binding videoclip-menu-open

# MODERNZ
i                script-binding modernz/visibility

# VAPOURSYNTH:
V                vf toggle vapoursynth=~/vapoursynth/vapoursynth.vpy
V                vf toggle format=yuv420p,vapoursynth=~/vapoursynth/vapoursynth.vpy:4:4

# PLAY_WITH_MPV:
`                cycle border
CTRL+UP          add window-scale 0.05
CTRL+DOWN        add window-scale -0.05
